[project]
name = "btp-rag"
version = "0.1.0"
description = "Plateforme de capitalisation et génération de dossiers d'appels d'offres BTP"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    # Orchestration (LangGraph >=0.2.20 pour coller à langchain-core 0.3)
    "langgraph>=0.2.20",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    # RAG (LlamaIndex + Ollama)
    "llama-index>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-llms-ollama>=0.3.0",
    "llama-index-embeddings-ollama>=0.3.0",
    # Bases — un seul pilote Postgres : asyncpg (SQLAlchemy async)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "qdrant-client>=1.11.0",
    "neo4j>=5.24.0",
    # Fuzzy matching entités graphe (Levenshtein / token_set)
    "rapidfuzz>=3.9.0",
    # Stockage & file d'attente
    "minio>=7.2.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    # Documents légers (pas d'OCR, pas de WeasyPrint)
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "markdown>=3.6.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
# Ingestion PDF numériques — isolé du build Docker de base
ingest = ["docling>=2.0.0"]
# OCR scans CPU. PaddlePaddle : wheels 3.12 parfois absents (ARM/Mac/CPU).
# Ne pas installer dans l'image API. Seulement le worker OCR, après vérif des wheels.
ocr = ["paddleocr>=2.8.0,<3", "paddlepaddle>=2.6.0", "pymupdf>=1.24.0"]
# OCR GPU : n'installer qu'avec ocr-gpu (pas ocr + gpu en même temps — conflit libpaddle).
# PaddleOCR 3.x exige Paddle 3.x ; on reste en 2.x (API use_gpu stable).
ocr-gpu = [
    "paddleocr>=2.8.0,<3",
    "paddlepaddle-gpu>=2.6.0",
    "pymupdf>=1.24.0",
    "nvidia-cudnn-cu12==8.9.7.29",
    "nvidia-cublas-cu12",
]
# Alias historique — préférer ocr-gpu sur machine NVIDIA.
gpu = ["paddlepaddle-gpu>=2.6.0"]
embed-hf = [
    "llama-index-embeddings-huggingface>=0.3.0",
    "sentence-transformers>=3.0.0",
]
rerank = ["llama-index-postprocessor-flag-embedding-reranker>=0.2.0"]
export-pdf = ["weasyprint>=62.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
