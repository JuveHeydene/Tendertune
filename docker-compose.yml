# Dev (défaut) : docker compose up -d  → infra seulement
# Stack Docker : docker compose --profile dev up -d
#   (ou --profile app : même chose)
#   infra + API + worker + un seul front Vite  http://localhost:5174
# Hybride hôte : infra + cd backend_ao && uv run uvicorn … + cd frontend_ao && npm run dev -- --port 5174
# GPU : docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile dev up -d

name: btp-rag

x-app-build: &app-build
  context: ./backend_ao
  # DNS du daemon Docker souvent cassé vers PyPI ; le DNS de l'hôte fonctionne.
  network: host

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-ao_user}:${POSTGRES_PASSWORD:-ao_pass}@postgres:5432/${POSTGRES_DB:-ao_db}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  QDRANT_URL: http://qdrant:6333
  QDRANT_GRPC_HOST: qdrant
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_HOST: neo4j
  NEO4J_BOLT_PORT: "7687"
  REDIS_URL: redis://redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: minio:9000
  MINIO_HOST: minio
  MINIO_PORT: "9000"
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  USE_GPU: ${USE_GPU:-false}
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ao_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ao_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ao_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend_ao/scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ao_user} -d ${POSTGRES_DB:-ao_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # L'image officielle n'embarque ni wget ni curl.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    profiles: ["app", "dev"]
    build: *app-build
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    env_file: .env
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend_ao/app:/app/app
      - ./backend_ao/scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  worker:
    profiles: ["app", "dev"]
    build: *app-build
    entrypoint: ["./docker-entrypoint-worker.sh"]
    env_file: .env
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend_ao/app:/app/app
      - ./backend_ao/scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["dev", "app"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_DEV_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    volumes:
      - ./frontend_ao:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  redis_data:
  minio_data:
  frontend_node_modules:
